version: "v0.4"

project:
  name: "Affine compression and a universal lower bound for Sidon subsets"
  description: >-
    Every sufficiently large finite set A of integers has a strict Sidon subset
    of cardinality at least (2/(3 sqrt(3)) - epsilon) sqrt(|A|), for every fixed
    positive epsilon. The cardinality threshold is uniform in A and independent
    of its diameter. Repeated summands are allowed in the Sidon definition.
    The development proves an injective forward Freiman compression estimate,
    combines it with Singer sets at prime-power moduli, and derives the optimized
    asymptotic using a proved prime number theorem. It also establishes finite
    bounds with ceilings and transfer to torsion-free abelian groups, including
    real vector spaces. This does not resolve the conjectural coefficient 1.
    Publication novelty has not been established.
  authors:
    - "Xinjie He"
  # Licensee 10.0.0 reports the GPLv3 license text using this legacy SPDX ID.
  # The source grant and retained Singer notices are explicitly GPL-3.0-only.
  license: "GPL-3.0"
  responsible_maintainers:
    - "Xinjie He"

# The submitted repository is intended to contain the substantive proof source.
# If that changes to a thin wrapper, add repository.substantive_formalization
# with the actual public repository and immutable commit instead of this comment.

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B30", "11B75", "05B10"]

sources:
  - title: "Affine compression and largest Sidon subsets: Research report and proof audit"
    type: "other"
    location: "docs/research-report.tex; unpublished report dated 3 October 2026; Theorem 1.1 and sections on affine compression, Singer averaging, and real-space transfer"
    relationship: "formalizes"
    note: >-
      The informal report preceded this formalization. The report was developed
      in a user-directed Codex research session. Its human bibliographic
      authorship is not assigned here while project authorship is pending.
      A verbatim source copy is included in docs/research-report.tex.
      Only the scope stated in this metadata is claimed to be formalized;
      the report contains additional results and exploratory material.
      Source-based metadata describes this provenance, not a judgment about
      whether the mathematical bound is new in the literature.
  - title: "On the largest Sidon subset in a finite subset of R^N"
    authors: ["Alexandre Bailleul", "Robin Riblet"]
    id: "https://arxiv.org/abs/2605.03181v1"
    type: "paper"
    location: "Theorem 2.2, Lemma 2.3, and the Singer covering argument"
    relationship: "adapts"
    note: >-
      Supplies the starting compression-and-Singer strategy. The present
      argument adds a shared affine shift and exact two-point averaging,
      giving |C| >= ceil(n/2 - n(n-1)/(8m)) in Z/mZ. The source's explicit
      asymptotic coefficient is 1/(3 sqrt(3)); it is not asserted to be the
      strongest consequence of all previously published work.
    author_endorsement: "not-contacted"
  - title: "Solving a linear equation in a set of integers II"
    authors: ["Imre Z. Ruzsa"]
    id: "https://doi.org/10.4064/aa-72-4-385-397"
    type: "paper"
    location: "Acta Arithmetica 72 (1995), 385-397; Definition 4.3 and Theorem 4.4"
    relationship: "adapts"
    note: >-
      Prior affine randomization and transfer of forbidden coincidence patterns
      are relevant to the method and its provenance. Specializing the published
      transfer theorem gives a universal coefficient 1/5 for strict Sidon
      subsets. The project does not claim invention of affine randomization.
    author_endorsement: "not-contacted"
  - title: "A theorem in finite projective geometry and some applications to number theory"
    authors: ["James Singer"]
    id: "https://doi.org/10.2307/1990067"
    type: "paper"
    location: "Transactions of the American Mathematical Society 43 (1938), 377-385"
    relationship: "formalizes"
    note: >-
      Supporting finite-geometric ingredient: a strict Sidon set of size q+1
      in the cyclic group of order q^2+q+1 for every prime power q. The actual
      Lean proof is adapted from the separate formalization credited below.
    author_endorsement: "n/a"
  - title: "Additive Combinatorics, Exercises 2"
    authors: ["Ben Green"]
    id: "https://people.maths.ox.ac.uk/greenbj/papers/addcomb-sheet2.pdf"
    type: "other"
    location: "Questions 7 and 8"
    relationship: "background"
    note: >-
      Public exercise notes contain a compression assertion which would imply
      a universal coefficient 1/4. Its proof and publication provenance have
      not been resolved in this project. No step of the formal proof relies
      on that assertion, and novelty relative to prior work remains open.
    author_endorsement: "not-contacted"

