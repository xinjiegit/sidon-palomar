status:
  scope: >-
    The proof development, ported to Lean 4.35.0-rc2, proves the universal integer bound,
    the exact finite prime-power bound with two ceilings, variable-density
    compression for 0 <= delta <= 1/2, and transfer to torsion-free abelian
    groups. The core development and vendored PNT modules have rebuilt on that
    toolchain. Local Comparator verification passed for all five selected
    statements, including con-ron, Lean's kernel, and NanoDa. That local run
    used the Mac no-sandbox option; the supplied Linux sandbox CI is configured
    but has not been run. Palomar's own verification remains a separate step.
    The report's weighted refinements,
    structural obstructions, and exploratory computations are outside this
    formalization. The Sidon conjecture with coefficient 1 remains unresolved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "autonomous"
      framework: "OpenAI Codex"
      tool_setup: >-
        AI agents performed mathematical exploration, literature searches,
        informal proof writing, Lean proof development, compilation and axiom
        audits, and separate adversarial checks. Exact model snapshot names
        for all earlier phases were not retained and are not reconstructed.
      prompting_notes: >-
        The user set the strict Sidon problem and research objectives,
        requested an end-to-end formalization, and then requested preparation
        for Palomar. The initial research session had a two-hour elapsed-time
        budget. Subsequent formalization and packaging were separate phases.
  notes: >-
    AI contributions are substantive and include the proposed improvement,
    proof text, and Lean source. Human project authors and responsible
    maintainers must be identified explicitly before submission. No independent
    human mathematical review, endorsement by cited authors, or Palomar
    acceptance is claimed. The project owner's requests do not by themselves
    establish that a human has checked every mathematical or Lean statement.

fidelity:
  divergences: >-
    The proof implements centered open circular cells instead of the report's
    shifted half-open floor construction. Both express the same affine
    compression strategy, with boundary sets of measure zero. The formal
    quantifiers explicitly put the cardinality threshold before the ambient
    integer set. The finite estimates retain ceilings. Forward Freiman
    preservation and injectivity, rather than reflection of all additive
    equalities, are used for pullback. The torsion-free-group extension is a
    formalized strengthening of the integer and real-space presentation.

review:
  status: "agent-reviewed"
  reviewers: ["Codex proof-audit agents"]
  notes: >-
    The existing development has separate agent audits of semantic fidelity,
    Singer's construction, asymptotic quantifiers, and ambient transfer,
    together with Lean compilation and transitive axiom reports. These are
    automated checks, not independent human peer review. Lean 4.31 kernel
    checking is recorded for the original proof. All 19 core modules and the
    nine vendored PNT modules rebuilt on Lean 4.35.0-rc2 during preparation.
    Local Comparator verification of the five selected statements completed
    successfully on 4 October 2026 UTC, with con-ron processing 80,778
    declarations and both Lean and NanoDa accepting. The local Mac run used
    the no-sandbox option. The provided Linux sandbox CI and Palomar's own
    verification have not been run. No public submission has been made.

alignment:
  namespace: "PalomarSidon"
  statements:
    - source: "Research report, Theorem 1.1, universal asymptotic assertion"
      lean: "PalomarSidon.universal_integer_bound"
      module: "Solution"
      note: >-
        A positive epsilon is followed by a single cardinality threshold and
        then every integer set above that threshold. The Sidon predicate
        includes repeated summands.
    - source: "Research report, Theorem 1.1, finite inequality"
      lean: "PalomarSidon.finite_prime_power_bound"
      module: "Solution"
      note: >-
        For each prime power q, the subgroup modulus is q^2+q+1 and both
        integer ceilings in the source inequality are retained.
    - source: "Variable-density refinement of the report's affine compression theorem"
      lean: "PalomarSidon.affine_compression"
      module: "Solution"
      note: >-
        Every positive modulus m and 0 <= delta <= 1/2 admit a subset C and
        injective forward Freiman map into Z/mZ with
        |C| >= ceil(delta*n - delta^2*n*(n-1)/(2*m)). The report's half-density
        statement follows by delta = 1/2. No converse Freiman implication is
        asserted.
    - source: "Research report, Theorem 1.1 and transfer from real configurations"
      lean: "PalomarSidon.universal_real_bound"
      module: "Solution"
      note: "The common threshold precedes the finite dimension and the ambient set."
    - source: "Generalization of the report's finite-configuration transfer"
      lean: "PalomarSidon.universal_torsion_free_bound"
      module: "Solution"
      note: >-
        Every torsion-free abelian group satisfies the same lower bound. The
        Lean statement fixes that group before quantifying the threshold;
        the underlying proof chooses the integer theorem's threshold.

